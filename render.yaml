services:
  - type: web
    name: srms-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    plan: starter
    disk:
      name: srms-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_PATH
        value: /var/data/srms.db
      - key: JWT_EXPIRY_HOURS
        value: 2
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN1_NAME
        value: Primary Admin
      - key: ADMIN1_LOGIN_ID
        sync: false
      - key: ADMIN1_PASSWORD
        sync: false
      - key: ADMIN2_NAME
        value: Secondary Admin
      - key: ADMIN2_LOGIN_ID
        sync: false
      - key: ADMIN2_PASSWORD
        sync: false
